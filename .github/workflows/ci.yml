name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Node Dependencies
        run: bun install --frozen-lockfile

      - name: Cache Nx Task Cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
            ${{ runner.os }}-nx-

      - name: Secret Hygiene Check
        run: bun run lint:secrets

      - name: Code Style Check
        run: bun run format:check

      - name: Run Unit Tests
        run: bun run test

      - name: Build Release APK
        run: |
          chmod +x gradlew build.sh
          bun run build

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DebugToggle-release-artifacts
          path: |
            dist/DebugToggle-release.apk
            dist/DebugToggle-release.apk.sha256
            dist/DebugToggle-v*.apk
            dist/DebugToggle-v*.apk.sha256
          retention-days: 7
