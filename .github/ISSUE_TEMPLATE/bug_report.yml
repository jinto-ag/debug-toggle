name: Bug Report
description: File a bug report for DebugToggle
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue in DebugToggle.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this issue?
      placeholder: |
        1. Open DebugToggle
        2. Toggle USB Debugging
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Device & App Diagnostics
      description: Diagnostic details (generated automatically via in-app 'Report Bug' button).
      placeholder: |
        App Version: 1.0.0
        Android Version: Android 14 / API 34
        Device Model: Manufacturer Model
    validations:
      required: false
